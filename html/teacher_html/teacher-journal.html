<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/journal.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>Document</title>
  </head>
  <body class="stop-animation">
    <header class="header">
      <div class="logo-header">
        <i class="bi bi-book"></i>
        <h4>Онлайн журнал</h4>
      </div>
      <ul class="nav-list-top">
        <li class="nav-el-top">
          <div class="el"><i class="bi bi-bell-fill"></i></div>
        </li>
        <li class="nav-el-top">
          <div class="el"><i class="bi bi-gear-fill"></i></div>
        </li>
      </ul>
    </header>

    <nav class="sidebar">
      <div class="logo-section">
        <button class="toggle-btn"><i class="bi bi-list icon"></i></button>
      </div>
      <ul class="nav-list">
        <li>
          <a
            href="/html/teacher_html/teacher-main.html"
            data-target="main"
            class="nav-link active"
            ><i class="bi bi-house icon"></i>
            <span class="link-name">Головна</span>
          </a>
        </li>
        <li>
          <a
            href="/html/teacher_html/teacher-profil.html"
            data-target="profil"
            class="nav-link"
            ><i class="bi bi-person icon"></i>
            <span class="link-name">Особистий кабінет</span></a
          >
        </li>
        <li>
          <a
            href="/html//teacher_html/journal-main.html"
            data-target="journal"
            class="nav-link"
            ><i class="bi bi-book icon"></i
            ><span class="link-name">Журнал</span></a
          >
        </li>
        <li>
          <a
            href="/html/teacher_html/teacher-schedule.html"
            data-target="schedule"
            class="nav-link"
            ><i class="bi bi-journal-text icon"></i
            ><span class="link-name">Розклад</span></a
          >
        </li>
        <li>
          <a
            href="/html/teacher_html/teacher-profil-curator.html"
            data-target="profil-curator"
            class="nav-link"
            ><i class="bi bi-people icon"></i
            ><span class="link-name">Кабінет куратора</span></a
          >
        </li>
        <li class="exit">
          <a href="#" class="nav-link"
            ><i class="bi bi-box-arrow-right icon"></i
            ><span class="link-name">Вихід з акаунту</span></a
          >
        </li>
      </ul>
    </nav>
    <main class="main-content">
      <div class="container">
        <div class="card">
          <div class="month-container">
            <button data-number="8" class="monthbtn">Вересень</button>
            <button data-number="9" class="monthbtn">Жовтень</button>
            <button data-number="10" class="monthbtn">Листопад</button>
            <button data-number="11" class="monthbtn">Грудень</button>
            <button data-number="0" class="monthbtn">Січень</button>
            <button data-number="1" class="monthbtn">Лютий</button>
            <button data-number="2" class="monthbtn">Березень</button>
            <button data-number="3" class="monthbtn">Квітень</button>
            <button data-number="4" class="monthbtn">Травень</button>
            <button data-number="5" class="monthbtn">Червень</button>
          </div>
          <div class="control-unit">
            <div class="infoLine">
              <button class="comeback">
                <i class="bi bi-arrow-left comeback-icon"></i>
              </button>
              <div class="select-group">Основи програмування П-33</div>
              <form action="/search" method="GET" class="search-form">
                <div class="input-wrapper">
                  <i class="bi bi-search search-icon"></i>
                  <input
                    class="search-input"
                    type="search"
                    id="search-input"
                    name="query "
                    placeholder="Пошук студентів..."
                  />
                </div>
              </form>
            </div>
            <div>
              <button class="print-outbtn">Експортувати</button>
              <button class="saveData">Зберегти зміни</button>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr class="date-container">
                  <!-- <th class="sticky-corner">Учень/День</th>
                  <th>15.05</th> -->
                </tr>
                <div class="date-panel hidden">
                  <button class="insert-colum-right">
                    Додати стовпчик справа
                  </button>
                  <button class="insert-topic">Заповнити тему</button>
                </div>
              </thead>
              <tbody>
                <!-- <tr class="row">
                  <td><div>1.Годлевський Кирил</div></td>
                  <td><input type="text" class="grade-input" /></td>
                </tr> -->
              </tbody>
            </table>
            <div class="input-topic-lesson hidden">
              <button
                class="btn-close-lessonModal"
                aria-label="Закрити модальне вікно"
              >
                <i class="bi bi-x-circle"></i>
              </button>

              <h2 class="modal-title">Дані про заняття</h2>

              <div class="form-group">
                <label for="lesson-type">Тип заняття</label>
                <select name="lesson-type" id="lesson-type" class="select">
                  <option value="para">Пара</option>
                  <option value="notebook">Зошит</option>
                  <option value="test">Рубіж</option>
                  <option value="semester">Семестр</option>
                </select>
              </div>

              <div class="form-group">
                <label for="lesson-date">Дата</label>
                <select name="lesson-date" id="lesson-date" class="select">
                  <!-- Тут дати будуть підтягуватися через JS -->
                  <option value="" disabled selected>Оберіть дату...</option>
                </select>
              </div>

              <div class="form-group">
                <label for="lesson-topic">Тема</label>
                <input
                  type="text"
                  id="lesson-topic"
                  class="input"
                  placeholder="Введіть тему заняття..."
                />
              </div>

              <button class="btn modal-save-btn">Зберегти</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="modal hidden">
      <button class="btn-close-modal"><i class="bi bi-x-circle"></i></button>

      <h2>Ви впевнені що хочете вийти?</h2>
      <button class="exitBtn exitBtnNo">Ні</button>
      <button class="exitBtn exitBtnYes">Так</button>
    </div>
    <div class="overlay hidden"></div>

    <script src="/js/global.js"></script>
    <script src="/js/teacher-journal.js"></script>
  </body>
</html>
