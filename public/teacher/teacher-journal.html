<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/journal.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="../js/theme.js"></script>
    <script src="../js/select.js" defer></script>
    <title>Document</title>
  </head>
  <body class="stop-animation">
    <main class="main-content">
      <div class="container">
        <div class="card">
          <div class="month-container">
            <button data-number="8" class="monthbtn">Вересень</button>
            <button data-number="9" class="monthbtn">Жовтень</button>
            <button data-number="10" class="monthbtn">Листопад</button>
            <button data-number="11" class="monthbtn">Грудень</button>
            <button data-number="0" class="monthbtn">Січень</button>
            <button data-number="1" class="monthbtn">Лютий</button>
            <button data-number="2" class="monthbtn">Березень</button>
            <button data-number="3" class="monthbtn">Квітень</button>
            <button data-number="4" class="monthbtn">Травень</button>
            <button data-number="5" class="monthbtn">Червень</button>
          </div>
          <div class="control-unit">
            <div class="infoLine">
              <button class="comeback">
                <i class="bi bi-arrow-left comeback-icon"></i>
              </button>
              <div class="select-group"></div>
              <form action="/search" method="GET" class="search-form">
                <div class="input-wrapper">
                  <i class="bi bi-search search-icon"></i>
                  <input
                    class="search-input"
                    type="search"
                    id="search-input"
                    name="query "
                    placeholder="Пошук студентів..."
                  />
                </div>
              </form>
            </div>
            <div>
              <button class="create-lesson">Додати нове заняття</button>
              <button class="print-outbtn">Експортувати</button>
              <button class="saveData">Зберегти зміни</button>
            </div>
          </div>
          <div class="table-container">
            <div class="table-container">
              <table>
                <thead>
                  <tr class="date-container"></tr>
                </thead>

                <tbody></tbody>
              </table>
            </div>
            <table>
              <thead>
                <tr class="date-container">
                  <!-- <th class="sticky-corner">Учень/День</th>
                  <th>15.05</th> -->
                </tr>
              </thead>
              <tbody>
                <!-- <tr class="row">
                  <td><div>1.Годлевський Кирил</div></td>
                  <td><input type="text" class="grade-input" /></td>
                </tr> -->
              </tbody>
            </table>
          </div>
          <div class="modal-overlay hidden">
            <div class="input-topic-lesson">
              <button
                class="btn-close-lessonModal"
                aria-label="Закрити модальне вікно"
              >
                <i class="bi bi-x-circle"></i>
              </button>

              <h2 class="modal-title">Дані про заняття</h2>

              <div class="form-group">
                <label for="lesson-type">Тип заняття</label>
                <select
                  name="lesson-type"
                  id="lesson-type"
                  class="select lesson-type"
                >
                  <option value="para">Пара</option>
                  <option value="notebook">Зошит</option>
                  <option value="test">Рубіж</option>
                  <option value="semester">Семестр</option>
                </select>
              </div>

              <div class="form-group">
                <label for="lesson-date">Дата</label>
                <input
                  type="date"
                  id="lesson-date"
                  name="lesson-date"
                  class="input lesson-date"
                />
              </div>

              <div class="form-group">
                <label for="lesson-number">Час проведення</label>
                <select
                  name="lesson-number"
                  id="lesson-number"
                  class="select lesson-number"
                >
                  <option value="1">1 (8:30-9:30)</option>
                  <option value="2">2 (8:30-9:30)</option>
                  <option value="3">3 (8:30-9:30)</option>
                  <option value="4">4 (8:30-9:30)</option>
                  <option value="5">5 (8:30-9:30)</option>
                  <option value="6">6 (8:30-9:30)</option>
                  <option value="7">7 (8:30-9:30)</option>
                </select>
              </div>

              <div class="form-group">
                <label for="lesson-topic">Місце</label>
                <input
                  type="text"
                  id="lesson-room"
                  class="input lesson-room"
                  placeholder="Введіть аудиторію..."
                />
              </div>

              <div class="form-group">
                <label for="lesson-topic">Тема</label>
                <input
                  type="text"
                  id="lesson-topic"
                  class="input lesson-topic"
                  placeholder="Введіть тему заняття..."
                />
              </div>

              <div class="form-group">
                <label for="lesson-topic">Домашнє завдання</label>
                <input
                  type="text"
                  id="lesson-homework"
                  class="input lesson-homework"
                  placeholder="Введіть завдання..."
                />
              </div>

              <button class="btn modal-save-btn">Зберегти</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/teacher/teacher-journal.js"></script>
  </body>
</html>
