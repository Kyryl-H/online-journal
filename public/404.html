<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Онлайн журнал</title>
    <script src="/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo-header">
        <svg
          class="logo-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 6.5C10.2 5 7.6 4.5 4 4.5v13c3.6 0 6.2.5 8 2 1.8-1.5 4.4-2 8-2v-13c-3.6 0-6.2.5-8 2z"
          />
          <path d="M12 6.5v13" />
        </svg>
        <h4>Онлайн журнал</h4>
      </div>
    </header>

    <main class="error-page">
      <section class="error-card" role="alert">
        <div class="error-code" aria-hidden="true">
          <span>4</span>
          <span class="error-code__book">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 6.5C10.2 5 7.6 4.5 4 4.5v13c3.6 0 6.2.5 8 2 1.8-1.5 4.4-2 8-2v-13c-3.6 0-6.2.5-8 2z"
              />
              <path d="M12 6.5v13" />
              <path d="M8.5 10.5h0M15.5 10.5h0" stroke-width="2.4" />
              <path d="M9.5 14.5c.8-.6 4.2-.6 5 0" />
            </svg>
          </span>
          <span>4</span>
        </div>

        <h1 class="error-title">Сторінку не знайдено</h1>
        <p class="error-text">
          Схоже, такої сторінки в журналі немає: її могли видалити, перемістити
          або в адресі є помилка.
        </p>

        <div class="error-actions">
          <button type="button" class="btn-secondary" id="goBack">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5M11 18l-6-6 6-6" />
            </svg>
            Назад
          </button>
          <a href="/" class="btn-primary">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" />
            </svg>
            На головну
          </a>
        </div>
      </section>
    </main>

    <script>
      document.getElementById("goBack").addEventListener("click", () => {
        if (history.length > 1) history.back();
        else location.href = "/";
      });
    </script>
  </body>
</html>
