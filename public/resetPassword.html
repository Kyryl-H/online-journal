<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07181b" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="./js/theme.js"></script>
    <title>Aleph - Скидання пароля</title>
  </head>
  <body>
    <main class="form-content">
      <header class="login-brand">
        <span class="login-logo">
          <img src="/assets/icon/logo-mark-Prime.svg" alt="" decoding="async" />
        </span>
        <h1 class="login-title">Aleph</h1>
        <p class="login-subtitle">Скидання пароля</p>
      </header>

      <form action="/reset" method="post" novalidate>
        <div class="input-box">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input
            class="email"
            type="email"
            id="input-gmail"
            name="fgmail"
            placeholder=" "
            autocomplete="email"
            required
          />
          <label for="input-gmail">Електронна пошта</label>
        </div>
        <div class="remember">
          <a href="/login.html" class="login-forgot">Вхід</a>
        </div>
        <button type="submit" class="btn reset">Скинути пароль</button>
      </form>
    </main>
    <script type="module" src="./js/reserPassword.js"></script>
  </body>
</html>
