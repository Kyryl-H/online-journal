<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/profil.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>Profil</title>
  </head>
  <body class="stop-animation">
    <main class="main-content">
      <div class="container">
        <div class="greeting-message">
          <h1 class="greeting">Особистий кабінет</h1>
        </div>

        <div class="info-card">
          <h2 class="title-name">Особисті дані:</h2>

          <div class="info-row">
            <div class="icon-box"><i class="bi bi-person-fill"></i></div>
            <div class="info-label">ПІБ</div>
            <div class="info-value fullName"></div>
          </div>
          <div class="info-row">
            <div class="icon-box">
              <i class="bi bi-suitcase-lg-fill"></i>
            </div>
            <div class="info-label">Куратор:</div>
            <div class="info-value curator"></div>
          </div>
          <div class="info-row">
            <div class="icon-box"><i class="bi bi-people-fill"></i></div>
            <div class="info-label">Група:</div>
            <div class="info-value group"></div>
          </div>
          <div class="info-row">
            <div class="icon-box"><i class="bi bi-envelope"></i></div>
            <div class="info-label">Email:</div>
            <div class="info-value gmail"></div>
          </div>
          <div class="info-row">
            <div class="icon-box"><i class="bi bi-unlock"></i></div>
            <button class="resetPassword">Скинути пароль</button>
          </div>
        </div>
        <div>
          <div class="info-card statistic">
            <h2 class="title-name">Статистика:</h2>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/js/profil.js"></script>
  </body>
</html>
