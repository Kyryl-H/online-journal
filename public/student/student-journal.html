<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg" />

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/journal.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="../js/theme.js"></script>
    <script src="../js/select.js" defer></script>

    <title>Aleph - Мій журнал</title>
  </head>
  <body class="stop-animation journal-page">
    <main class="main-content">
      <div class="container">
        <div class="card">
          <div class="message">
            <h1>Мій журнал</h1>
            <h3>Оцінки, предмети та пропуски</h3>
          </div>

          <div class="journal-summary">
            <article class="summary-card">
              <span class="summary-icon summary-icon--avg" aria-hidden="true">
                <i class="bi bi-star-fill"></i>
              </span>
              <div class="summary-body">
                <span class="summary-label">Середній бал</span>
                <strong class="summary-average">0.00</strong>
              </div>
            </article>

            <article class="summary-card">
              <span class="summary-icon summary-icon--count" aria-hidden="true">
                <i class="bi bi-bar-chart-line-fill"></i>
              </span>
              <div class="summary-body">
                <span class="summary-label">Кількість оцінок</span>
                <strong class="summary-count">0</strong>
              </div>
            </article>

            <article class="summary-card">
              <span class="summary-icon summary-icon--miss" aria-hidden="true">
                <i class="bi bi-person-x-fill"></i>
              </span>
              <div class="summary-body">
                <span class="summary-label">Пропуски</span>
                <strong class="summary-miss">0</strong>
              </div>
            </article>
          </div>

          <div class="journal-filters">
            <div class="filter-field">
              <label for="filter-subject"
                ><i class="bi bi-book"></i> Предмет</label
              >
              <select id="filter-subject" class="select filter-subject">
                <option value="all">Всі предмети</option>
              </select>
            </div>

            <div class="filter-field">
              <label for="filter-period"
                ><i class="bi bi-calendar-range"></i> Період</label
              >
              <select id="filter-period" class="select filter-period">
                <option value="all">За весь час</option>
                <option value="month">Останній місяць</option>
                <option value="week">Поточний тиждень</option>
              </select>
            </div>

            <div class="filter-actions">
              <span class="filter-count" aria-live="polite"
                >Показано 0 з 0</span
              >
              <button type="button" class="btn-secondary filter-reset" disabled>
                <i class="bi bi-arrow-counterclockwise"></i> Скинути
              </button>
            </div>
          </div>

          <div class="journal-table-wrap">
            <table class="journal-table">
              <thead>
                <tr>
                  <th>Предмет</th>
                  <th>Викладач</th>
                  <th>Дата</th>
                  <th>Оцінка</th>
                  <th>Аудиторія</th>
                  <th class="col-details">Д/З</th>
                </tr>
              </thead>
              <tbody class="journal-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <div class="hw-modal" hidden>
      <div class="hw-backdrop" data-hw-close></div>
      <div
        class="hw-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="hw-subject"
      >
        <button
          type="button"
          class="hw-close"
          data-hw-close
          aria-label="Закрити"
        >
          <i class="bi bi-x-lg"></i>
        </button>

        <header class="hw-head">
          <span class="hw-head-icon" aria-hidden="true"
            ><i class="bi bi-journal-text"></i
          ></span>
          <div>
            <h2 class="hw-subject" id="hw-subject">Предмет</h2>
            <p class="hw-date">
              <i class="bi bi-calendar3"></i>
              <span class="hw-date-text">—</span>
            </p>
          </div>
        </header>

        <section class="hw-section">
          <h3><i class="bi bi-bookmark"></i> Тема заняття</h3>
          <p class="hw-topic">—</p>
        </section>

        <section class="hw-section">
          <h3><i class="bi bi-pencil-square"></i> Домашнє завдання</h3>
          <p class="hw-text">—</p>
        </section>

        <button type="button" class="btn-primary hw-ok" data-hw-close>
          Зрозуміло
        </button>
      </div>
    </div>
    <script type="module" src="/js/student/journal-main.js"></script>
  </body>
</html>
