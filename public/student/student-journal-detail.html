<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/journal.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>Document</title>
  </head>
  <body class="stop-animation">
    <main class="main-content">
      <div class="container">
        <div class="card">
          <div class="month-container">
            <button data-number="8" class="monthbtn">Вересень</button>
            <button data-number="9" class="monthbtn">Жовтень</button>
            <button data-number="10" class="monthbtn">Листопад</button>
            <button data-number="11" class="monthbtn">Грудень</button>
            <button data-number="0" class="monthbtn">Січень</button>
            <button data-number="1" class="monthbtn">Лютий</button>
            <button data-number="2" class="monthbtn">Березень</button>
            <button data-number="3" class="monthbtn">Квітень</button>
            <button data-number="4" class="monthbtn">Травень</button>
            <button data-number="5" class="monthbtn">Червень</button>
          </div>
          <div class="control-unit">
            <div class="infoLine">
              <button class="comeback">
                <i class="bi bi-arrow-left comeback-icon"></i>
              </button>
              <div class="select-group">Основи програмування П-33</div>
              <form action="/search" method="GET" class="search-form">
                <div class="input-wrapper">
                  <i class="bi bi-search search-icon"></i>
                  <input
                    class="search-input"
                    type="search"
                    id="search-input"
                    name="query "
                    placeholder="Пошук студентів..."
                  />
                </div>
              </form>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr class="date-container">
                  <!-- <th class="sticky-corner">Учень/День</th>
                  <th>15.05</th> -->
                </tr>
              </thead>
              <tbody>
                <!-- <tr class="row">
                  <td><div>1.Годлевський Кирил</div></td>
                  <td><input type="text" class="grade-input" /></td>
                </tr> -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/teacher-journal.js"></script>
  </body>
</html>
