<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/schedule.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>Document</title>
  </head>
  <body class="stop-animation">
    <main class="main-content">
      <div class="container">
        <div class="card schedule-card">
          <div class="schedule-header">
            <h1 class="schedule-title">Розклад заннять</h1>

            <div class="schedule-controls">
              <div class="group-selector">
                <span class="selector-label">Група:</span>
                <select class="group-select">
                  <!-- <option value="group.id" selected>П-33</option> -->
                </select>
              </div>

              <div class="week-navigation">
                <button class="btn nav-btn comeback">Попередній</button>
                <span class="current-week">Поточний</span>
                <button class="btn nav-btn next">Наступний</button>
              </div>
            </div>
          </div>

          <div class="schedule-grid">
            <div class="day-column">
              <div class="day-header">
                <h5 class="para">№</h5>
                <h3 class="day-name">Понеділок</h3>
                <h5 class="audut">Ауд.</h5>
              </div>
              <div data-day="1" class="lesson-container"></div>
            </div>
            <div class="day-column">
              <div class="day-header">
                <h5>№</h5>
                <h3 class="day-name">Вівторок</h3>
                <h5>Ауд.</h5>
              </div>

              <div data-day="2" class="lesson-container"></div>
            </div>
            <div class="day-column">
              <div class="day-header">
                <h5>№</h5>

                <h3 class="day-name">Середа</h3>
                <h5>Ауд.</h5>
              </div>
              <div data-day="3" class="lesson-container"></div>
            </div>
            <div class="day-column">
              <div class="day-header">
                <h5>№</h5>

                <h3 class="day-name">Четверг</h3>
                <h5>Ауд.</h5>
              </div>
              <div data-day="4" class="lesson-container"></div>
            </div>
            <div class="day-column">
              <div class="day-header">
                <h5>№</h5>

                <h3 class="day-name">П'ятниця</h3>
                <h5>Ауд.</h5>
              </div>
              <div data-day="5" class="lesson-container"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/js/schedule.js"></script>
  </body>
</html>
