<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07181b" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="./js/theme.js"></script>
    <title>Aleph - Скидання пароля</title>
  </head>
  <body>
    <main class="form-content">
      <header class="login-brand">
        <span class="login-logo">
          <img src="/assets/icon/logo-mark-Prime.svg" alt="" decoding="async" />
        </span>
        <h1 class="login-title">Aleph</h1>
        <p class="login-subtitle">Скинути пароль</p>
      </header>

      <form action="/new-password" method="post" novalidate>
        <div class="input-box">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            class="new-password"
            type="password"
            id="input-password"
            name="new-password"
            placeholder=" "
            autocomplete="new-password"
            required
          />
          <label for="input-password">Новий пароль</label>
          <button
            type="button"
            class="eye-toggle"
            aria-label="Показати пароль"
            aria-pressed="false"
          >
            <i class="bi bi-eye"></i><i class="bi bi-eye-slash"></i>
          </button>
        </div>

        <div class="input-box">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            class="repeated-password"
            type="password"
            id="input-repeated-password"
            name="repeated-password"
            placeholder=" "
            autocomplete="new-password"
            required
          />
          <label for="input-repeated-password">Повторіть пароль</label>
          <button
            type="button"
            class="eye-toggle"
            aria-label="Показати пароль"
            aria-pressed="false"
          >
            <i class="bi bi-eye"></i><i class="bi bi-eye-slash"></i>
          </button>
        </div>

        <button type="submit" class="btn login">Оновити пароль</button>
      </form>
    </main>
    <script type="module" src="./js/new-password.js"></script>
  </body>
</html>
