<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/teacher-profil.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>Profil</title>
  </head>
  <body class="stop-animation">
    <main class="main-content">
      <div class="container">
        <div class="greeting-message">
          <h1 class="greeting">Особистий кабінет</h1>
        </div>

        <div class="info-card">
          <h2 class="title-name">Особисті дані:</h2>

          <div class="info-row">
            <div class="icon-box"><i class="bi bi-person-fill"></i></div>
            <div class="info-label">ПІБ</div>
            <div class="info-value fullName">Дашкевич Володимр</div>
          </div>
          <div class="info-row">
            <div class="icon-box">
              <i class="bi bi-suitcase-lg-fill"></i>
            </div>
            <div class="info-label">Посада:</div>
            <div class="info-value">Викладач</div>
          </div>
          <div class="info-row">
            <div class="icon-box"><i class="bi bi-people-fill"></i></div>
            <div class="info-label">Група:</div>
            <div class="info-value group">П-13</div>
          </div>
          <div class="info-row">
            <div class="icon-box"><i class="bi bi-envelope"></i></div>
            <div class="info-label">Email:</div>
            <div class="info-value gmail">v.dashkevych.class.ztc.org.ua</div>
          </div>
          <div class="info-row">
            <div class="icon-box"><i class="bi bi-unlock"></i></div>
            <button class="resetPassword">Скинути пароль</button>
          </div>
        </div>
        <div>
          <div class="info-card subjects-taught">
            <h2 class="title-name">Предмети:</h2>
            <!-- <div class="info-row">
              <div class="icon-box"><i class="bi bi-database"></i></div>
              <div class="info-label">Алгоритми та стуктури даних:</div>
              <div class="info-value">P-33, K-29</div>
            </div> -->
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/js/teacher-profil.js"></script>
  </body>
</html>
