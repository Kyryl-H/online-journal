<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <title>Journal</title>
  </head>
  <body>
    <div class="form-content">
      <form action="">
        <h1>Log in</h1>

        <div class="input-box">
          <input
            class="email"
            type="email"
            placeholder="Gmail"
            id="input-gmail"
            name="fgmail"
            required
          /><br />
        </div>

        <div class="input-box">
          <input
            class="password"
            type="text"
            placeholder="Password"
            id="input-password"
            name="fpassword"
            required
          />
        </div>

        <div class="remember">
          <label for=""><input type="checkbox" />Remember me</label>
          <a href="#" class="login-forgot">Forgot passwor?</a>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>
    </div>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
